<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Workshop wall: six cuckoo clocks on a bench, doors opening one after another, weights rising as each door closes">
<rect width="1200" height="340" fill="#8a8478"/>
<rect x="0" y="0" width="1200" height="150" fill="#9a958a"/>
<rect x="1010" y="24" width="130" height="120" fill="#aebabe"/>
<g stroke="#7c8890" stroke-width="2"><line x1="1030" y1="36" x2="1026" y2="66"/><line x1="1070" y1="30" x2="1066" y2="72"/><line x1="1110" y1="38" x2="1106" y2="64"/></g>
<rect x="40" y="86" width="700" height="10" fill="#3c2715"/>
<g fill="#a89e8e" stroke="#7e7666" stroke-width="1.5">
<polygon points="70,86 70,50 100,32 130,50 130,86"/><polygon points="300,86 300,50 330,32 360,50 360,86"/><polygon points="530,86 530,50 560,32 590,50 590,86"/>
</g>
<!-- six clocks on the bench, doors opening in sequence, never together -->
<g font-family="sans-serif">
<g transform="translate(70,150)">
<polygon points="0,110 0,26 45,0 90,26 90,110" fill="#5e3e22" stroke="#3c2715" stroke-width="2"/>
